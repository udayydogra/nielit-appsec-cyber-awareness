# Serves the static SPA (~20-32 MB nginx) and proxies /api + /verify to the
# lab-manager. Same-origin so the session cookie flows without CORS complications.

# Maps the Upgrade header so WebSocket connections proxy correctly (http scope).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SSE needs buffering off for the mentor stream.
  location /api/ {
    proxy_pass http://lab-manager:4000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # WebSocket upgrade (Tier-3 browser terminal) + SSE (mentor) both need this.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /verify/ {
    proxy_pass http://lab-manager:4000/verify/;
    proxy_set_header Host $host;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
